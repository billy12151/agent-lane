id: gemini-cli
display_name: Gemini CLI
category: coding
description: Google Gemini 命令行 agent harness
# `-p ""` 选择非交互（headless）模式；空的 prompt 字符串让 gemini 从 stdin 读真正的 prompt
# （agentlane 通过 stdin 喂 prompt）。
# `--yolo` 自动批准所有工具调用，让 agent 能自主读写文件、跑命令。
# `--skip-trust` 绕过交互式的工作区信任询问——不加的话非交互运行在未信任目录里会卡住。
# 这等于让 agent 拥有对工作区的全部、不受沙箱限制的控制权——只对你信任的目录运行流程。
# flags 已通过 `gemini --help` 实测验证（npm @google/gemini-cli，2026-07-30）。
# 认证：环境里需要 GEMINI_API_KEY（或 Vertex / GOOGLE_GENAI_USE_GCA）。
runtime:
  command: [gemini, --yolo, --skip-trust, -p, ""]
detect:
  install_hint: 先安装 Gemini CLI（npm i -g @google/gemini-cli）并完成认证。
capabilities: [code_generation, documentation, test_generation]
