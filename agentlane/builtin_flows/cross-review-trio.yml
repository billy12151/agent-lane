name: cross-review-trio
version: 1
description: |
  三方交叉评审 —— 核心的"视角互补"模式。一个 agent 出初稿；两个*不同的* agent 并行
  独立评审同一份初稿；第三步汇合它们的共识、分歧，以及两家都漏掉的盲区。价值在于独立
  视角之间的分歧，而不是速度：单个 agent 永远发现不了自己的盲区，所以两个评审者绝不能
  看到对方的输出，只能看到共享的初稿。
defaults:
  timeout: 300
  retry: 1
  max_visits: 3
steps:
  - id: draft
    agent: claude-code
    prompt: |
      Produce the work requested in the surrounding task context. Read the
      relevant files in the current workspace and output the result (design,
      code, document, or analysis). Be concrete and self-contained — the next
      steps review this output without seeing your workspace.
    output:
      format: markdown

  - id: review-a
    agent: codex
    prompt: |
      You are reviewer A. Independently review the work below for correctness,
      completeness, and risks. Read the relevant files in the current workspace
      yourself — do not trust the author's summary. List concrete problems with
      file/line references. You are the ONLY reviewer at this stage; another
      reviewer is looking at the same work in parallel and you must not be
      influenced by them.

      Work under review:
      {steps:draft}
    depends_on: [draft]
    output:
      format: markdown

  - id: review-b
    agent: gemini-cli
    prompt: |
      You are reviewer B. Independently review the work below for correctness,
      completeness, and risks. Read the relevant files in the current workspace
      yourself — do not trust the author's summary. List concrete problems with
      file/line references. You are the ONLY reviewer at this stage; another
      reviewer is looking at the same work in parallel and you must not be
      influenced by them.

      Work under review:
      {steps:draft}
    depends_on: [draft]
    output:
      format: markdown

  - id: synthesize
    agent: claude-code
    prompt: |
      Two independent reviewers (A and B) each reviewed the same draft without
      seeing each other's work. Re-read the draft and the workspace, then
      synthesize their findings:

      1. CONSENSUS — problems BOTH reviewers found (highest confidence).
      2. DIVERGENCE — where they disagree, and your judgment on who is right.
      3. BLIND SPOTS — problems NEITHER reviewer caught but you can see.

      Draft:
      {steps:draft}

      Reviewer A:
      {steps:review-a}

      Reviewer B:
      {steps:review-b}
    depends_on: [review-a, review-b]
    output:
      format: markdown
