state:
  file: ~/.agentlane/runs.json

logs:
  dir: ~/.agentlane/logs

flows:
  dir: ~/.agentlane/flows

agents:
  dir: ~/.agentlane/agents
  commands:
    # The autonomous-execution flags below are what make a harness actually
    # useful inside a non-interactive flow: they skip per-action approval
    # prompts (which would otherwise stall forever) and let the agent read
    # files / run shell commands on its own. They grant the agent full,
    # unsandboxed control over the workspace, so only run flows against
    # directories you trust. Flags verified 2026-07-30 via each CLI's --help.
    codex: [codex, exec, --dangerously-bypass-approvals-and-sandbox, --skip-git-repo-check, -]
    claude-code: [claude, -p, --dangerously-skip-permissions]
    gemini-cli: [gemini, --yolo, --skip-trust, -p, ""]
    # kimi 0.31.1 的 `-p` 只收字面 prompt、不读 stdin（`-p -` 会把 `-` 当字面
    # prompt），所以包一层 sh 把 stdin 转发为 `-p` 实参。`--yolo`/`--auto` 与
    # `-p` 互斥，headless 工具审批由 kimi 自身权限策略处理。实测于 2026-08-02。
    kimi-code: [sh, -c, 'exec kimi -p "$(cat)"']

memory:
  enabled: false
  workspace: default

cleanup:
  auto_prune: false
  keep_days: 7
  keep_failed: true
